packages:
  - apps/*

# Packages allowed to run install scripts: Prisma downloads its schema engine.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma

ignoredBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  # GHSA-g3hv-75wg-m249: the shadcn CLI pulls minimatch 10 through ts-morph.
  # minimatch 11 keeps the minimatch(path, pattern) call that ts-morph uses.
  '@ts-morph/common>minimatch': ^11.0.1
